- type: entity
  id: StationGunBase
  parent: BaseStructure
  # abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Cannons/body.rsi
    layers:
    - state: body-0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,-6,2,6"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
- type: entity
  id: StationGunBarrelBase
  parent: StationGunBase
  # abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Cannons/barrel.rsi
    layers:
    - state: barrel
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-6,0.45,6"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000

